name: Build macOS app

# Manual trigger: you press the "Run workflow" button on GitHub
on:
  workflow_dispatch:

jobs:
  build:
    # GitHub's cloud Mac (Apple Silicon). For old Intel Macs use: macos-13
    runs-on: macos-latest

    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 yt-dlp pyinstaller imageio-ffmpeg

      - name: Extract a static ffmpeg binary to bundle
        run: |
          FFMPEG_SRC=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          cp "$FFMPEG_SRC" ffmpeg
          chmod +x ffmpeg
          ./ffmpeg -version | head -1

      - name: Build the .app with PyInstaller
        run: |
          pyinstaller --windowed \
            --name "Universal Video Downloader" \
            --icon "universal-video-downloader-icon.icns" \
            --add-binary "ffmpeg:." \
            universal_video_downloader.py

      - name: Zip the app for download
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "Universal Video Downloader.app" \
            "Universal-Video-Downloader-mac.zip"

      - name: Upload the result
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Video-Downloader-macOS
          path: dist/Universal-Video-Downloader-mac.zip
