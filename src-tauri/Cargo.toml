[package]
name = "universal-video-downloader"
version = "2.0.0"
description = "Universal Video Downloader by Kubs"
authors = ["Kubs"]
edition = "2021"

[lib]
name = "uvd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls = the operating system's certificate store (always current)
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
